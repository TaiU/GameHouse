<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>迴廊幻境配樂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@400;500&display=swap">
<style>
/* 版面：一間暮色中的試聽室。上方是隨音樂起伏的地平線，下面是六種氣氛與音效按鈕 */
:root {
  --dusk: #171a2b; --dusk-2: #222741; --line: #34395c;
  --mist: #ece6f4; --mist-dim: #a9a4c2; --glow: #f0b98a;
  --f-display: "LXGW WenKai TC", "Noto Serif TC", "PingFang TC", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { min-height: 100%; }
body { margin: 0; background: var(--dusk); background-image: radial-gradient(ellipse at 50% -20%, var(--dusk-2), var(--dusk) 70%);
  color: var(--mist); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
.wrap { max-width: 860px; margin: 0 auto; padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
h1 { font-family: var(--f-display); font-size: clamp(32px, 6vw, 48px); margin: 0; letter-spacing: .06em; line-height: 1.15; text-wrap: balance; }
h1 em { font-style: normal; color: var(--glow); }
h2 { font-family: var(--f-display); font-size: 21px; margin: 0; font-weight: 400; letter-spacing: .08em; }
.lead { margin: 6px 0 0; color: var(--mist-dim); max-width: 60ch; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--glow); outline-offset: 2px; }
.stage { position: relative; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: rgba(0,0,0,.18); }
canvas { display: block; width: 100%; height: 180px; }
.stage .now { position: absolute; left: 16px; bottom: 12px; font-family: var(--f-display); color: var(--mist-dim); font-size: 14px; letter-spacing: .1em; }
.stage .now b { color: var(--mist); font-weight: 400; font-size: 20px; margin-right: 8px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; }
.play { border: 1px solid var(--glow); background: transparent; color: var(--glow); border-radius: 99px; padding: 8px 26px; font-family: var(--f-display); font-size: 18px; letter-spacing: .1em; }
.play[aria-pressed="true"] { background: var(--glow); color: var(--dusk); }
label { display: flex; align-items: center; gap: 10px; color: var(--mist-dim); font-size: 14px; }
input[type=range] { accent-color: var(--glow); width: 160px; max-width: 40vw; }
.moods { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.mood { text-align: left; background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: grid; gap: 2px; transition: border-color .2s, background .2s; }
.mood:hover { border-color: var(--mist-dim); }
.mood[aria-pressed="true"] { border-color: var(--glow); background: rgba(240,185,138,.08); }
.mood .lv { font-size: 12px; letter-spacing: .14em; color: var(--glow); }
.mood .nm { font-family: var(--f-display); font-size: 22px; line-height: 1.3; }
.mood .ds { font-size: 13px; color: var(--mist-dim); }
.sfx { display: flex; flex-wrap: wrap; gap: 8px; }
.sfx button { border: 1px solid var(--line); background: rgba(255,255,255,.03); border-radius: 99px; padding: 5px 14px; font-size: 14px; }
.sfx button:hover { border-color: var(--glow); }
.sfx button small { color: var(--mist-dim); margin-left: 6px; font-size: 12px; }
section { display: grid; gap: 12px; }
.note { color: var(--mist-dim); font-size: 13px; max-width: 64ch; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>迴廊幻境 <em>配樂</em></h1>
    <p class="lead">為迴廊幻境寫的原創環境音樂，全部在瀏覽器裡即時合成。每一層換一種氣氛，旋律是固定的短主題，每次播放會有些微不同的變奏與留白。戴耳機聽最好。</p>
  </header>
  <div class="stage"><canvas id="viz" aria-hidden="true"></canvas><div class="now"><b id="now-name">晨霧</b><span id="now-state">尚未播放</span></div></div>
  <div class="controls">
    <button class="play" id="play" aria-pressed="false">播放</button>
    <label for="vol">音量 <input type="range" id="vol" min="0" max="100"></label>
  </div>
  <section>
    <h2>六種氣氛</h2>
    <div class="moods" id="moods"></div>
    <p class="note">遊戲裡第 1 層用晨霧，第 2 層用砂岸，依序到第 6 層歸途，之後循環。換層時大約 4 秒交叉淡入。</p>
  </section>
  <section>
    <h2>音效</h2>
    <div class="sfx" id="sfx"></div>
    <p class="note">音效的音高取自目前氣氛的調式與和弦，所以和背景音樂一起響也不會打架。音樂關著時音效照樣能聽。</p>
  </section>
</div>
<script src="js/drift-audio.js"></script>
<script>
(function () {
  const A = window.DriftAudio, $ = s => document.querySelector(s);
  const HUES = [250, 32, 280, 210, 120, 18];
  const SFX = [['tap', '點平台'], ['step', '走一步', 'step'], ['rotate', '轉動建築'], ['slide', '滑軌上', 1], ['slide', '滑軌下', -1],
    ['blocked', '走不過去'], ['unlock', '路接上了'], ['door', '抵達門口'], ['win', '過關'], ['ui', '按鈕']];
  let steps = 0;
  $('#moods').innerHTML = A.moods.map((m, i) => `<button class="mood" data-i="${i}" aria-pressed="${i === A.mood}"><span class="lv">第 ${i + 1} 層</span><span class="nm">${m.name}</span><span class="ds">${m.desc}</span></button>`).join('');
  $('#sfx').innerHTML = SFX.map(([n, label], k) => `<button data-k="${k}">${label}<small>${n}</small></button>`).join('');
  const vol = $('#vol'); vol.value = Math.round(A.volume * 100);
  vol.oninput = () => A.setVolume(vol.value / 100);
  function sync() {
    $('#play').setAttribute('aria-pressed', A.on); $('#play').textContent = A.on ? '暫停' : '播放';
    $('#now-name').textContent = A.moods[A.mood].name; $('#now-state').textContent = A.on ? '播放中' : '已暫停';
    document.querySelectorAll('.mood').forEach(b => b.setAttribute('aria-pressed', +b.dataset.i === A.mood));
  }
  $('#play').onclick = () => { A.on ? A.stop() : A.start(); sync(); };
  $('#moods').onclick = e => { const b = e.target.closest('.mood'); if (!b) return; A.setMood(+b.dataset.i); if (!A.on) A.start(); sync(); };
  $('#sfx').onclick = e => {
    const b = e.target.closest('button'); if (!b) return; const [n, , arg] = SFX[+b.dataset.k];
    if (arg === 'step') { A.sfx('step', ++steps); } else A.sfx(n, arg ?? 1);
  };
  // 地平線：兩條隨頻譜起伏的光帶，顏色跟著氣氛
  const cv = $('#viz'), g = cv.getContext('2d'); let data = null, hue = HUES[0];
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function draw(time) {
    const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
    hue += (HUES[A.mood] - hue) * .03;
    const an = A.analyser; if (an && !data) data = new Uint8Array(an.frequencyBinCount);
    if (an) an.getByteFrequencyData(data);
    const sky = g.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, `hsla(${hue},40%,22%,1)`); sky.addColorStop(1, `hsla(${hue + 20},35%,10%,1)`);
    g.fillStyle = sky; g.fillRect(0, 0, w, h);
    g.fillStyle = `hsla(${hue + 40},80%,80%,.85)`; g.beginPath(); g.arc(w * .78, h * .32, h * .09, 0, 7); g.fill();
    [[.62, .35, 0], [.78, .55, 40]].forEach(([y0, a, off], layer) => {
      g.beginPath(); g.moveTo(0, h);
      for (let x = 0; x <= w; x += 6 * devicePixelRatio) {
        const k = data ? data[Math.floor((x / w) * 120) + 2 + layer * 20] / 255 : 0;
        const wave = still ? 0 : Math.sin(x / w * 6 + time / 4000 + layer) * h * .03;
        g.lineTo(x, h * y0 - k * h * (.28 - layer * .1) + wave);
      }
      g.lineTo(w, h); g.closePath();
      g.fillStyle = `hsla(${hue + off},30%,${18 - layer * 6}%,${.6 + a})`; g.fill();
    });
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw); sync();
})();
</script>
</body>
</html>
