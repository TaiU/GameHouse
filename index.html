<!doctype html>
<html lang="zh-Hant" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Terry 的遊戲間</title>
<meta name="description" content="數字、牌桌、棋盤和一點點空間錯覺，十桌原創小遊戲。">
<meta name="theme-color" content="#0B0C12">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="遊戲間">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="claude:viewport-fit-sides" content="cover">
<script>
// 先套上記住的深淺色，避免第一幀閃一下
try { const t = localStorage.getItem('gr.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 風格：深色舞台、單一橘紅強調色、膠囊外形，所有位移帶一次輕微回彈（Terry 的 UI 風格定義 v2） */
:root {
  --bg: #E9E8E5; --surface: #FFFFFF; --ink: #111110; --muted: #6F6E6A; --fill: #F0EFEC; --line: #DEDDD9;
  --accent: #FF5B2E; --on-accent: #111110;
  --glow: rgba(255,91,46,.32); --glow-line: rgba(255,91,46,.55); --glow-soft: rgba(255,91,46,.2);
  --danger: #D93A3F; --on-danger: #FFFFFF;
  --chip: #111110; --on-chip: #FFFFFF; --edge: rgba(255,255,255,0);
  --g1: #8F8E89; --g2: #CBCAC5;
  --board: #DCDAD4; --board-line: #6F6E6A;
  --suit-red: color-mix(in srgb, var(--accent) 80%, #000);
  --font: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --num: "Bricolage Grotesque", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --display: "LXGW WenKai TC", "Kaiti TC", "STKaiti", "KaiTi", serif;
  --r: 28px; --r-panel: 24px;
  --spring: cubic-bezier(.34,1.3,.64,1); --t-spring: .45s;
  --spring-soft: cubic-bezier(.3,1.25,.45,1);
  --soft: cubic-bezier(.22,1,.36,1);
  --pad-x: max(24px, env(safe-area-inset-left, 0px));
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #0B0C12; --surface: #12141C; --ink: #ECEAE4; --muted: #A3A7B7; --fill: #1A1D28; --line: #262A39;
  --glow: rgba(255,91,46,.38);
  --danger: #F0645A; --on-danger: #1B0B09;
  --chip: #262A39; --on-chip: #ECEAE4; --edge: rgba(255,255,255,.06);
  --g1: #6B6F80; --g2: #3A3E4E;
  --board: #2A2E3D; --board-line: #7D8193;
  color-scheme: dark;
}
html.theming, html.theming * { transition: background-color .5s var(--soft), color .5s var(--soft), border-color .5s var(--soft), fill .5s var(--soft), stroke .5s var(--soft) !important; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; -webkit-tap-highlight-color: transparent; }
.wrap { box-sizing: border-box; max-width: 1128px; margin: 0 auto; padding: 8px var(--pad-x) 64px; padding-right: max(24px, env(safe-area-inset-right, 0px)); }
button { font: inherit; color: inherit; cursor: pointer; -webkit-user-select: none; user-select: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.num, .stat b, .stat span { font-family: var(--num); font-variant-numeric: tabular-nums; }
svg.ic { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* 置頂列 */
.bar { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
  padding-top: env(safe-area-inset-top, 0px); }
.bar-in { max-width: 1128px; margin: 0 auto; display: flex; align-items: center; gap: 16px; min-height: 64px; padding: 8px var(--pad-x); padding-right: max(24px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; min-width: 0; }
.brand img { width: 32px; height: 32px; border-radius: 9px; }
.bar h1 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.3; margin: 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar .grow { flex: 1; }
.back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; padding: 0 18px 0 12px; border: 0; border-radius: 999px; background: var(--fill); color: var(--ink); font-weight: 500; flex: none; }
.iconbtn { width: 44px; height: 44px; border-radius: 50%; border: 0; display: grid; place-items: center; background: var(--fill); color: var(--ink); flex: none; padding: 0; }
.back, .iconbtn, .tools button, .seg button, .box, .sd-pad button, .cb-pad button, .dr-levels button, .install button, .primary.inline, .sf-h {
  transition: transform .2s ease-out, background-color .25s var(--soft), color .25s var(--soft), border-color .25s var(--soft); }
.back:hover, .iconbtn:hover { background: var(--line); }
.back:active, .tools button:active:not(:disabled), .seg button:active, .install button:active, .primary.inline:active { transform: scale(.94); }
.iconbtn:active, .dr-levels button:active:not(:disabled) { transform: scale(.85); }
.ic-sun { display: none; } [data-theme="dark"] .ic-sun { display: block; } [data-theme="dark"] .ic-moon { display: none; }

/* 膠囊提示：滑鼠停 300ms、長按 500ms */
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--chip); color: var(--on-chip); font-size: 13px; line-height: 1.5; padding: 6px 14px; border-radius: 999px; white-space: nowrap;
  transform: translate(-50%, 0) scale(.5); opacity: 0; transition: transform .2s ease-in, opacity .2s ease-in; }
.tip.show { transform: translate(-50%, 0) scale(1); opacity: 1; transition: transform var(--t-spring) var(--spring), opacity .25s var(--soft); }

/* 大廳 */
.hero { padding: 24px 0 32px; }
.hero h2 { font-family: var(--display); font-weight: 400; font-size: 40px; line-height: 1.1; margin: 0; text-wrap: balance; }
.hero h2 em { font-style: normal; color: var(--accent); }
.hero p { margin: 8px 0 0; color: var(--muted); font-size: 16px; }
.hero-stat { display: flex; align-items: baseline; gap: 8px; margin-top: 24px; }
.hero-stat b { font-family: var(--num); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.hero-stat b small { font-size: 26px; color: var(--muted); font-weight: 700; }
.hero-stat > span { color: var(--muted); font-size: 13px; }
.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
.box {
  position: relative; text-align: left; border: 0; border-radius: var(--r); background: var(--surface); color: var(--ink);
  box-shadow: inset 0 1px 0 var(--edge); padding: 24px; display: grid; grid-template-rows: auto auto 1fr auto; gap: 8px; min-height: 200px; overflow: hidden;
  transition: transform var(--t-spring) var(--spring), background-color .25s var(--soft);
}
.box:hover:not([disabled]) { transform: translateY(-4px); }
.box:active:not([disabled]) { transform: scale(.95); transition-duration: .2s; transition-timing-function: ease-out; }
.box[disabled] { cursor: default; opacity: .5; }
.box .no { font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .06em; }
.box h3 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1.3; margin: 0; }
.box p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.box .tag { justify-self: start; display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 500; padding: 4px 14px 4px 10px; border-radius: 999px; background: var(--fill); color: var(--ink); margin-top: 8px; }
.box .tag svg.ic { width: 18px; height: 18px; }
.box .tag.wait { color: var(--muted); padding-left: 14px; }
.box .glyph { position: absolute; right: 20px; top: 14px; font-family: var(--display); font-size: 48px; line-height: 1; color: var(--ink); opacity: .07; pointer-events: none; }
.box.focus .tag { background: var(--accent); color: var(--on-accent); }
.box.focus .last { position: absolute; right: 20px; top: 24px; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--accent); }
.focus { box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--glow-line), 0 0 28px var(--glow); animation: glow 3s ease-in-out infinite; }
@keyframes glow { 0%, 100% { box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--glow-line), 0 0 20px var(--glow); } 50% { box-shadow: inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--glow-line), 0 0 32px var(--glow); } }
.shelf.enter .box { animation: popin var(--t-spring) var(--spring) both; animation-delay: calc(var(--i) * 45ms); }
.shelf.enter .box.focus { animation: popin var(--t-spring) var(--spring) both, glow 3s ease-in-out .5s infinite; animation-delay: calc(var(--i) * 45ms), .6s; }
@keyframes popin { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
.install { display: flex; align-items: center; gap: 8px; margin: 0 0 16px; padding: 8px 8px 8px 24px; border-radius: 999px; background: var(--surface); box-shadow: inset 0 1px 0 var(--edge); color: var(--muted); font-size: 13px; line-height: 1.5; }
.install[hidden] { display: none; }
.install > span { flex: 1; min-width: 0; padding: 4px 0; }
.install b { color: var(--ink); font-weight: 500; }
.install .go { flex: none; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; min-height: 44px; padding: 0 20px; font-weight: 700; }
.install .x { flex: none; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--fill); color: var(--muted); display: grid; place-items: center; padding: 0; }
@media (max-width: 560px) { .install { border-radius: var(--r-panel); padding-left: 16px; } }
.foot { margin-top: 32px; color: var(--muted); font-size: 13px; line-height: 1.5; max-width: 62ch; }

/* 遊戲桌（共用元件） */
#table.enter #stage { animation: tablein .5s var(--spring) both; }
@keyframes tablein { from { opacity: 0; transform: scale(.96) translateY(16px); } to { opacity: 1; transform: none; } }
#stage { padding-top: 8px; }
.game-head { display: flex; justify-content: space-between; align-items: center; gap: 8px 16px; flex-wrap: wrap; margin-bottom: 16px; }
.stat { color: var(--muted); font-size: 13px; line-height: 1.5; }
.stat b { color: var(--ink); font-weight: 700; font-size: 16px; }
.seg { position: relative; display: inline-flex; padding: 4px; gap: 2px; border-radius: 999px; background: var(--fill); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg::before { content: ""; position: absolute; z-index: 0; top: 4px; bottom: 4px; left: 0; width: var(--sw, 0); transform: translateX(var(--sx, 0)); border-radius: 999px; background: var(--chip); opacity: 0; }
.seg.ready::before { opacity: 1; }
.seg.slide::before { transition: transform var(--t-spring) var(--spring), width var(--t-spring) var(--spring), background-color .5s var(--soft); }
.seg button { position: relative; z-index: 1; background: none; border: 0; min-height: 40px; padding: 0 16px; border-radius: 999px; color: var(--muted); font-size: 16px; white-space: nowrap; flex: none; }
.seg button:hover { color: var(--ink); }
.seg button.on { color: var(--on-chip); font-weight: 500; }
.seg:not(.ready) button.on { background: var(--chip); }
.tools { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.tools.center { justify-content: center; }
.tools button { min-height: 44px; background: var(--fill); color: var(--ink); border: 0; border-radius: 999px; padding: 0 20px; font-size: 16px; }
.tools button:hover:not(:disabled) { background: var(--line); }
.tools button.on { background: var(--chip); color: var(--on-chip); }
.tools button.primary, .tools button.primary:hover { background: var(--accent); color: var(--on-accent); font-weight: 700; }
.tools button[hidden] { display: none; }
button:disabled { opacity: .4; cursor: default; }
.msg { min-height: 1.6em; text-align: center; font-size: 16px; font-weight: 700; color: var(--accent); margin: 16px 0 0; }
.msg.pop { animation: msgpop var(--t-spring) var(--spring); }
@keyframes msgpop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: none; } }
.rule { color: var(--muted); font-size: 13px; line-height: 1.5; margin: 0 0 16px; max-width: 62ch; }
.rule b { color: var(--ink); font-weight: 500; }
.rule.center { text-align: center; margin: 8px auto 16px; }
.linkish { background: none; border: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 3px; padding: 0 4px; min-height: 32px; }
.primary.inline { margin-left: 8px; background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; min-height: 36px; padding: 0 16px; font-size: 13px; font-weight: 700; }

/* 數獨 */
.sd-wrap { display: flex; gap: 24px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
.sd-grid { display: grid; grid-template-columns: repeat(9, 1fr); grid-template-rows: repeat(9, 1fr); width: min(100%, 468px); aspect-ratio: 1; max-width: 100%;
  background: var(--surface); box-shadow: inset 0 1px 0 var(--edge), 0 0 0 2px var(--g1); border-radius: var(--r-panel); overflow: hidden; color: var(--ink); }
.sd-cell { min-width: 0; min-height: 0; overflow: hidden; display: grid; place-items: center; font-family: var(--num); font-variant-numeric: tabular-nums; font-size: clamp(18px, 4.6vw, 28px); font-weight: 500; color: var(--muted);
  border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); cursor: pointer; user-select: none; transition: background-color .2s var(--soft), color .2s var(--soft); }
.sd-cell:nth-child(9n) { border-right: 0; } .sd-cell:nth-last-child(-n+9) { border-bottom: 0; }
.sd-cell.br { border-right: 2px solid var(--g1); } .sd-cell.bb { border-bottom: 2px solid var(--g1); }
.sd-cell.given { color: var(--ink); font-weight: 700; }
.sd-cell.peer { background: var(--fill); } .sd-cell.same { background: var(--fill); color: var(--accent); }
.sd-cell.sel { background: var(--chip); color: var(--on-chip); }
.sd-cell.wrong { color: var(--danger); }
.notes { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; height: 100%; font-family: var(--num); font-size: clamp(9.5px, 1.8vw, 11px); font-weight: 500; color: var(--muted); }
.notes i { font-style: normal; display: grid; place-items: center; }
.sd-side { display: flex; flex-direction: column; gap: 8px; width: min(100%, 300px); }
.sd-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.sd-pad button { background: var(--fill); border: 0; border-radius: 999px; min-height: 56px; padding: 6px 0 4px; display: grid; place-content: center; }
.sd-pad button:hover:not(:disabled) { background: var(--line); }
.sd-pad button:active:not(:disabled) { transform: scale(.92); }
.sd-pad button b { font-family: var(--num); font-weight: 700; font-size: 24px; line-height: 1.1; }
.sd-pad button small { font-family: var(--num); font-size: 11px; color: var(--muted); min-height: 1.2em; line-height: 1.2; }
.sd-pad button:disabled { opacity: .3; cursor: default; }
@media (max-width: 720px) { .sd-pad { grid-template-columns: repeat(9, 1fr); gap: 4px; } .sd-pad button { min-height: 52px; } .sd-pad button b { font-size: 20px; } .sd-side { width: 100%; } }

/* 星位（色塊顏色是解題資訊，保留） */
.st-grid { --n: 7; display: grid; grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); width: min(100%, 480px); aspect-ratio: 1; margin: 0 auto; box-shadow: 0 0 0 2px #111110; border-radius: var(--r-panel); overflow: hidden; }
.st-cell { min-width: 0; min-height: 0; overflow: hidden; border: 0; border-right: 1px solid rgba(17,17,16,.16); border-bottom: 1px solid rgba(17,17,16,.16); display: grid; place-items: center; padding: 0; color: #111110; }
.st-cell.wr { border-right: 3px solid #111110; } .st-cell.wb { border-bottom: 3px solid #111110; }
.st-cell .star { font-size: clamp(20px, 5vw, 34px); line-height: 1; animation: popin .45s var(--spring); }
.st-cell .x { font-size: clamp(14px, 3vw, 20px); opacity: .45; }
.st-cell.bad .star { color: #C42F35; }
.st-cell.bad { box-shadow: inset 0 0 0 3px #C42F35; }

/* 五子棋 */
.gm-board { display: block; width: min(100%, 600px); aspect-ratio: 1; margin: 0 auto; border-radius: var(--r-panel); cursor: pointer; }

/* 麻將配對（牌面是遊戲本身的圖，保留牌的立體感） */
.tm-board { --tw: min(58px, calc((100vw - 64px) / 10.4)); --th: calc(var(--tw) * 1.3); --dz: calc(var(--tw) * .14);
  position: relative; width: calc(var(--tw) * 10 + var(--dz) * 3); height: calc(var(--th) * 6 + var(--dz) * 3); margin: 8px auto 0; max-width: 100%; }
.tm-tile { position: absolute; width: var(--tw); height: var(--th); padding: 2px; border-radius: calc(var(--tw) * .14);
  left: calc(var(--x) * var(--tw) + (3 - var(--z)) * var(--dz)); top: calc(var(--y) * var(--th) + (3 - var(--z)) * var(--dz));
  background: #F4F2EC; border: 1px solid #A9A7A0; box-shadow: 1px 1px 0 #CFCDC6, 2px 2px 0 #BDBBB4, 3px 3px 0 #A9A7A0, 4px 4px 0 #8E8C86, 5px 5px 6px rgba(0,0,0,.45);
  filter: brightness(.7) saturate(.8); transition: transform var(--t-spring) var(--spring), filter .2s var(--soft), background-color .2s var(--soft); }
.tm-tile svg { width: 100%; height: 100%; display: block; }
.tm-tile.free { filter: none; }
.tm-tile.free:hover { transform: translate(-1px, -2px); }
.tm-tile.sel { background: color-mix(in srgb, var(--accent) 34%, #F4F2EC); transform: translate(-1px, -4px); }
.tm-tile.hint { background: color-mix(in srgb, var(--accent) 18%, #F4F2EC); outline: 3px solid var(--accent); outline-offset: -3px; }
.tm-tile.nope { animation: nope .48s ease-out; }
@keyframes nope { 0%, 100% { translate: 0; } 15% { translate: -9px; } 30% { translate: 7px; } 45% { translate: -5px; } 60% { translate: 3px; } 75% { translate: -1px; } }

/* 楚河漢界 */
.xq-board { position: relative; width: min(100%, 520px); aspect-ratio: 9.2 / 10.2; margin: 0 auto; background: var(--board); border-radius: var(--r-panel); }
.xq-lines { position: absolute; inset: 0; width: 100%; height: 100%; }
.xq-lines g, .xq-lines rect, .xq-lines path, .xq-lines line { stroke: var(--board-line); }
.xq-lines text { fill: var(--board-line); }
.xq-pieces { position: absolute; inset: 0; }
.xq-p, .xq-dot, .xq-from { position: absolute; left: calc((var(--c) + .6) / 9.2 * 100%); top: calc((var(--r) + .6) / 10.2 * 100%); transform: translate(-50%, -50%); }
.xq-p { width: 9.4%; aspect-ratio: 1; border-radius: 50%; padding: 0; border: 2px solid currentColor; background: #F1EFE9; box-shadow: inset 0 0 0 3px #F1EFE9, inset 0 0 0 4px currentColor;
  font-family: var(--display); font-weight: 400; font-size: clamp(15px, 4.4vw, 26px); line-height: 1; display: grid; place-items: center; transition: transform var(--t-spring) var(--spring); }
.xq-p.red { color: var(--suit-red); } .xq-p.blk { color: #111110; }
.xq-p.sel { transform: translate(-50%, -50%) scale(1.14); }
.xq-p.last { outline: 2px solid var(--accent); outline-offset: 3px; }
.xq-from { width: 6%; aspect-ratio: 1; border: 2px dashed var(--accent); border-radius: 50%; opacity: .7; }
.xq-dot { width: 4%; aspect-ratio: 1; border-radius: 50%; border: 0; padding: 0; background: var(--accent); }
.xq-dot.cap { width: 10%; background: none; border: 3px solid var(--accent); z-index: 2; }

/* 大老二 */
.b2-table { display: grid; grid-template-columns: 1fr 1.6fr 1fr; grid-template-areas: ". n ." "w c e"; gap: 8px; align-items: start; }
.b2-n { grid-area: n; } .b2-w { grid-area: w; } .b2-e { grid-area: e; } .b2-center { grid-area: c; }
.b2-seat { display: grid; gap: 6px; justify-items: center; text-align: center; min-width: 0; }
.b2-name { font-size: 16px; font-weight: 500; display: grid; transition: color .25s var(--soft); }
.b2-name small { font-family: var(--num); font-size: 13px; font-weight: 400; color: var(--muted); font-variant-numeric: tabular-nums; }
.b2-name.on { color: var(--accent); }
.b2-backs { display: flex; height: 34px; }
.b2-backs span { width: 22px; height: 32px; margin-left: -14px; border-radius: 4px; border: 1px solid var(--bg); background: repeating-linear-gradient(45deg, var(--g1) 0 4px, var(--g2) 4px 8px); }
.b2-backs span:first-child { margin-left: 0; }

/* 數字框框：框好的長方形用灰階，相鄰之間留 2px 表面色間隙 */

@media (max-width: 420px) { .cb-pad { gap: 4px; } }

/* 旋轉拼板．翻轉圖樣 */
.sp-modes { display: flex; width: max-content; margin: 0 auto 16px; }
.sf-goal { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 4px 0 16px; font-size: 13px; font-weight: 700; letter-spacing: .06em; color: var(--muted); }
.sf-mini { --n: 3; display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 2px; width: calc(var(--n) * 22px); padding: 6px; background: var(--surface); box-shadow: inset 0 1px 0 var(--edge); border-radius: 12px; }

.sf-t.ok::after { content: ""; position: absolute; right: 6px; bottom: 6px; width: 6px; height: 6px; border-radius: 50%; background: rgba(17,17,16,.45); transform: translateZ(1px); }

.sp-grid { --n: 5; display: grid; grid-template-columns: repeat(var(--n), 1fr); width: min(100%, 480px); aspect-ratio: 1; margin: 0 auto; gap: 4px; padding: 8px; box-sizing: border-box; background: var(--surface); box-shadow: inset 0 1px 0 var(--edge); border-radius: var(--r-panel); transition: box-shadow .35s var(--soft); }

.dr-stage { width: 100%; max-width: 760px; margin: 0 auto; border-radius: var(--r); overflow: hidden; touch-action: manipulation; }

@media (max-width: 560px) { .hero h2 { font-size: 34px; } .box { min-height: 0; padding: 24px 24px 16px; } .box p { margin-bottom: 8px; } .bar h1 { font-size: 20px; } }

<body>

<header class="bar">

      <svg class="ic ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </div>
</header>

<main class="wrap">
  <section id="hall">
    <div class="hero">
      <h2>Terry 的<em>遊戲間</em></h2>
      <p>數字、牌桌、棋盤和一點空間錯覺。</p>
      <div class="hero-stat"><b><span id="ready-count">0</span><small> / 10</small></b><span>桌已開桌</span></div>
    </div>
    <div class="install" id="install" hidden>
      <span id="install-text"></span>
      <button class="go" id="install-go" hidden>安裝</button>
      <button class="x" id="install-x" aria-label="不再顯示" data-tip="不再顯示"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="shelf" id="shelf"></div>
    <p class="foot">玩法參考常見的經典遊戲規則，畫面、關卡、名稱與音樂都是這個遊戲間自己的。進度與設定只存在你這台裝置的瀏覽器裡。</p>
  </section>

  <section id="table" hidden>
    <div id="stage"></div>
  </section>
</main>
<canvas id="confetti" hidden></canvas>

<script>
window.GameRoom = (function () {
  const games = {};
  return { games, register(id, mod) { games[id] = mod; } };
})();
</script>
<script src="js/sudoku.js"></script>
<script src="js/stars.js"></script>
<script src="js/gomoku.js"></script>
<script src="js/tilematch.js"></script>
<script src="js/xiangqi.js"></script>
<script src="js/bigtwo.js"></script>
<script src="js/numbox.js"></script>
<script src="js/cube.js"></script>

<script src="js/drift-audio.js"></script>
<script src="js/drift-levels.js"></script>
<script src="js/drift.js"></script>
<script>
(function () {
  const CATALOG = [
    { id: 'sudoku', no: '一', name: '九宮數獨', glyph: '九', desc: '四種難度，每題都只有唯一解。可做筆記、復原、看提示。' },
    { id: 'cube', no: '二', name: '轉角方塊', glyph: '方', desc: '3D 三階魔術方塊。一鍵打亂後自己轉回來，或按倒帶看它一步步還原。' },
    { id: 'spin', no: '三', name: '旋轉拼板', glyph: '旋', desc: '滑動整排或整列轉半圈，順序顛倒、板子翻面，轉出目標圖樣。另有轉板接線玩法。' },
    { id: 'mahjong', no: '四', name: '台灣麻將', glyph: '牌', href: 'mahjong/dist/index.html', desc: '十六張台麻，你和三家電腦。你原本優化過的牌桌直接搬進來，台數照本桌規則結算。' },
    { id: 'stars', no: '五', name: '星位', glyph: '★', desc: '每排、每列、每個色塊各一顆星，星星互不相碰。' },
    { id: 'numbox', no: '五', name: '數字框框', glyph: '框', desc: '拖拉畫出長方形，每塊恰好框住一個數字，格子數等於那個數字。三種盤面大小。' },
    { id: 'tilematch', no: '六', name: '疊牌配對', glyph: '發', desc: '疊了四層的麻將牌，兩兩配對把桌面清空。每局保證有解。' },
    { id: 'bigtwo', no: '七', name: '大老二', glyph: '♠', desc: '台灣常見玩法，和三家電腦對打。梅花 3 先出，五張牌組有順子、葫蘆、鐵支、同花順，跨局累計分數。' },
    { id: 'xiangqi', no: '八', name: '楚河漢界', glyph: '帥', desc: '中國象棋，對電腦有三種強度，也能兩人同機對弈。可悔棋。' },
    { id: 'gomoku', no: '九', name: '五子連珠', glyph: '●', desc: '十五路棋盤，先連成五子者勝。對電腦有兩種強度。' },
    { id: 'drift', no: '十', name: '迴廊幻境', glyph: '廊', desc: '轉動不可能的建築，讓小旅人走到終點，配上原創環境音樂。' },
  ];
  const api = {
    load(k, d) { try { const v = localStorage.getItem('gr.' + k); return v === null ? d : v; } catch (e) { return d; } },
    save(k, v) { try { localStorage.setItem('gr.' + k, v); } catch (e) {} },
    confetti,
  };
  const $ = id => document.getElementById(id);
  const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ARROW = '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l8 7-8 7"/></svg>';
  const shelf = $('shelf');
  const playable = g => !!(GameRoom.games[g.id] || g.href);
  const ready = CATALOG.filter(playable);

  // 大廳：上次玩的那一桌是畫面上唯一的焦點（呼吸光暈）
  function renderShelf() {
    const last = api.load('last', '');
    shelf.innerHTML = CATALOG.map((g, i) => {
      const ok = playable(g), focus = ok && g.id === last;
      return `<button class="box${focus ? ' focus' : ''}" data-id="${g.id}" style="--i:${Math.min(i, 12)}" ${ok ? '' : 'disabled'}>
        <span class="glyph" aria-hidden="true">${g.glyph}</span>
        <span class="no">第${g.no}桌</span><h3>${g.name}</h3><p>${g.desc}</p>
        <span class="tag ${ok ? 'ok' : 'wait'}">${ok ? ARROW + (focus ? '繼續玩' : '開始玩') : '準備中'}</span>
        ${focus ? '<span class="last" aria-hidden="true">上次玩</span>' : ''}</button>`;
    }).join('');

  }
  // 第五桌兩款各算半桌，總共 10 桌

  $('ready-count').textContent = tables.size;
  shelf.addEventListener('click', e => {
    const b = e.target.closest('.box'); if (!b || b.disabled) return;
    const g = CATALOG.find(x => x.id === b.dataset.id); api.save('last', g.id);
    if (g.href) location.href = g.href; else location.hash = g.id;
  });
  $('back').onclick = () => { location.hash = ''; };

  let cleanup = null;
  function route() {
    const id = location.hash.slice(1), g = CATALOG.find(x => x.id === id), mod = GameRoom.games[id];
    if (cleanup) { cleanup(); cleanup = null; }
    const stage = $('stage'); stage.innerHTML = '';
    const inGame = !!(g && mod);
    $('hall').hidden = inGame; $('table').hidden = !inGame;
    $('brand').hidden = inGame; $('back').hidden = !inGame; $('game-title').hidden = !inGame;
    if (inGame) {
      $('game-title').textContent = g.name; document.title = g.name + ' · Terry 的遊戲間';
      api.save('last', g.id);
      cleanup = mod.mount(stage, api) || null; window.scrollTo(0, 0);
      const t = $('table'); t.classList.remove('enter'); void t.offsetWidth; t.classList.add('enter');
    } else {
      document.title = 'Terry 的遊戲間'; renderShelf();
    }
    syncSegs(false);
  }

  // 分段切換：選中底塊滑到新的位置
  function syncSegs(animate) {
    document.querySelectorAll('.seg').forEach(seg => {
      const on = seg.querySelector('button.on');
      if (!on || !seg.offsetParent) { seg.classList.remove('ready'); return; }
      if (!animate || !seg.classList.contains('ready')) seg.classList.remove('slide');
      seg.style.setProperty('--sx', on.offsetLeft + 'px'); seg.style.setProperty('--sw', on.offsetWidth + 'px');
      if (!seg.classList.contains('ready')) { void seg.offsetWidth; seg.classList.add('ready'); requestAnimationFrame(() => seg.classList.add('slide')); }
    });
  }
  let segQueued = false;
  const queueSegs = () => { if (segQueued) return; segQueued = true; requestAnimationFrame(() => { segQueued = false; syncSegs(true); }); };
  // 新訊息彈入
  const popMsg = el => { if (!el.textContent.trim()) return; el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop'); };
  new MutationObserver(list => {
    let seg = false; const msgs = new Set();
    for (const m of list) {
      const el = m.target.nodeType === 1 ? m.target : m.target.parentElement;
      if (!el) continue;
      if (m.type === 'attributes' || m.type === 'childList') seg = true;
      const msg = el.closest('.msg'); if (msg && m.type !== 'attributes') msgs.add(msg);
    }
    if (seg) queueSegs();
    msgs.forEach(popMsg);
  }).observe($('stage'), { subtree: true, childList: true, characterData: true, attributes: true, attributeFilter: ['class', 'hidden'] });
  addEventListener('resize', queueSegs);
  if (document.fonts) document.fonts.ready.then(() => syncSegs(false));

  // 深淺色切換：記住選擇，顏色 500ms 過渡
  const themeColor = document.querySelector('meta[name="theme-color"]');
  const paintThemeColor = () => { themeColor.content = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim(); };
  paintThemeColor();
  let themeTimer = 0;
  $('theme').onclick = () => {
    const root = document.documentElement, next = root.dataset.theme === 'dark' ? 'light' : 'dark';
    if (!reduceMotion()) { root.classList.add('theming'); clearTimeout(themeTimer); themeTimer = setTimeout(() => root.classList.remove('theming'), 600); }
    root.dataset.theme = next; api.save('theme', next); paintThemeColor();
    dispatchEvent(new Event('gr-theme'));
  };

  // 圖示按鈕的膠囊提示：滑鼠停 300ms、長按 500ms
  const tip = document.createElement('div'); tip.className = 'tip'; tip.setAttribute('aria-hidden', 'true'); document.body.appendChild(tip);
  let tipTimer = 0;
  const showTip = el => { const r = el.getBoundingClientRect(); tip.textContent = el.dataset.tip; tip.style.left = Math.min(innerWidth - 80, Math.max(80, r.left + r.width / 2)) + 'px'; tip.style.top = (r.bottom + 8) + 'px'; tip.classList.add('show'); };
  const hideTip = () => { clearTimeout(tipTimer); tip.classList.remove('show'); };
  document.addEventListener('pointerover', e => { const el = e.target.closest('[data-tip]'); if (!el || e.pointerType !== 'mouse') return; clearTimeout(tipTimer); tipTimer = setTimeout(() => showTip(el), 300); });
  document.addEventListener('pointerout', e => { if (e.target.closest('[data-tip]')) hideTip(); });
  document.addEventListener('pointerdown', e => { const el = e.target.closest('[data-tip]'); hideTip(); if (el && e.pointerType !== 'mouse') tipTimer = setTimeout(() => showTip(el), 500); });
  document.addEventListener('pointerup', () => { clearTimeout(tipTimer); setTimeout(() => tip.classList.remove('show'), 900); });

  addEventListener('hashchange', route); route();

  function confetti() {
    if (reduceMotion()) return;
    const cv = $('confetti'), ctx = cv.getContext('2d');
    cv.hidden = false; cv.width = innerWidth; cv.height = innerHeight;
    const css = getComputedStyle(document.documentElement);
    const cols = ['--accent', '--accent', '--ink', '--g1'].map(v => css.getPropertyValue(v).trim());
    const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5, vx: (Math.random() - .5) * 2, vy: 2 + Math.random() * 3, c: cols[Math.floor(Math.random() * 4)], a: Math.random() * 6 }));
    let f = 0;
    (function tick() {
      ctx.clearRect(0, 0, cv.width, cv.height);
      ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += .1; ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(-5, -2, 10, 4, 2) : ctx.rect(-5, -2, 10, 4); ctx.fill(); ctx.restore(); });
      if (++f < 200) requestAnimationFrame(tick); else cv.hidden = true;
    })();
  }
})();
</script>
<script>
// 網頁 app：註冊離線用的 service worker，並在還沒安裝時提示加到主畫面
(function () {
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  const box = document.getElementById('install'), text = document.getElementById('install-text'), go = document.getElementById('install-go');
  const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
  let dismissed = false;
  try { dismissed = localStorage.getItem('gh-install-dismissed') === '1'; } catch (e) {}
  if (standalone || dismissed) return;
  document.getElementById('install-x').onclick = () => { box.hidden = true; try { localStorage.setItem('gh-install-dismissed', '1'); } catch (e) {} };
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (ios) {
    text.innerHTML = '想放到主畫面？在 Safari 點<b>分享</b>，再選<b>加入主畫面</b>，沒網路也能玩。';
    box.hidden = false;
  }
  let deferred = null;
  addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferred = e;
    text.innerHTML = '把遊戲間<b>安裝成 app</b>，沒網路也能玩。';
    go.hidden = false; box.hidden = false;
  });
  go.onclick = async () => { if (!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; box.hidden = true; };
  addEventListener('appinstalled', () => { box.hidden = true; });
})();
</script>
